name: Prototype APK and Web
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: prototype-build
  cancel-in-progress: false
jobs:
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm test
      - run: npm run build:android
        env:
          STORE: debug
      - name: Validate Android identity and portrait orientation
        run: |
          APK=$(find out -name '*.apk' -print -quit)
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee out/android-badging.txt
          grep -q "package: name='com.jollypanda.nostalgiaduel.debug'" out/android-badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml > out/android-manifest.txt
          grep -q 'screenOrientation.*0x1' out/android-manifest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nostalgia-duel-prototype
          path: out/*
          retention-days: 14
          if-no-files-found: error
