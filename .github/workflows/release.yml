name: Android releases
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read
concurrency:
  group: android-production-releases
  queue: max

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      targets: ${{ steps.plan.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: plan
        env:
          BUMP: ${{ inputs.bump || 'patch' }}
          HAS_SIGNING: ${{ secrets.KEYSTORE_BASE64 != '' && secrets.KEYSTORE_PASSWORD != '' && secrets.KEY_ALIAS != '' && secrets.KEY_PASSWORD != '' }}
          BAZAAR_READY: ${{ vars.BAZAAR_RSA_KEY != '' || secrets.BAZAAR_RSA_KEY != '' }}
          MYKET_READY: ${{ vars.MYKET_PUBLIC_KEY != '' || secrets.MYKET_PUBLIC_KEY != '' }}
        run: |
          echo "version=$(node scripts/version.mjs)" >> "$GITHUB_OUTPUT"
          node --input-type=module -e '
            const targets = ["debug"];
            for (const [target, ready] of [["bazaar", "BAZAAR_READY"], ["myket", "MYKET_READY"]]) {
              if (process.env.HAS_SIGNING === "true" && process.env[ready] === "true") targets.push(target);
              else console.log("::warning::No " + target + " package: signing or store billing public key is missing.");
            }
            import("node:fs").then(fs => fs.appendFileSync(process.env.GITHUB_OUTPUT, "targets=" + JSON.stringify(targets) + "\n"));
          '
      - run: npm ci
      - run: npm test
      - run: npm run test:online

  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.prepare.outputs.targets) }}
    env:
      STORE: ${{ matrix.target }}
      VERSION: ${{ needs.prepare.outputs.version }}
      REQUIRE_SIGNING: ${{ matrix.target != 'debug' }}
      ANDROID_GAMEPLAY_ONLY: ${{ matrix.target == 'debug' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run build:android
        env:
          KEYSTORE_BASE64: ${{ matrix.target != 'debug' && secrets.KEYSTORE_BASE64 || '' }}
          KEYSTORE_PASSWORD: ${{ matrix.target != 'debug' && secrets.KEYSTORE_PASSWORD || '' }}
          KEY_ALIAS: ${{ matrix.target != 'debug' && secrets.KEY_ALIAS || '' }}
          KEY_PASSWORD: ${{ matrix.target != 'debug' && secrets.KEY_PASSWORD || '' }}
          BAZAAR_RSA_KEY: ${{ vars.BAZAAR_RSA_KEY || secrets.BAZAAR_RSA_KEY }}
          MYKET_PUBLIC_KEY: ${{ vars.MYKET_PUBLIC_KEY || secrets.MYKET_PUBLIC_KEY }}
      - name: Verify Android outputs
        shell: bash
        run: |
          PACKAGE=com.jollypanda.nostalgiaduel
          if [[ "$STORE" == debug ]]; then PACKAGE+=.debug; fi
          APK=$(find out -maxdepth 1 -name '*.apk' -print -quit)
          SDK="$ANDROID_HOME/build-tools/36.0.0"
          "$SDK/apksigner" verify --print-certs "$APK"
          "$SDK/aapt" dump badging "$APK" > badging.txt
          grep -F "package: name='$PACKAGE'" badging.txt
          "$SDK/aapt" dump xmltree "$APK" AndroidManifest.xml > manifest.txt
          grep 'screenOrientation.*0x1' manifest.txt
          if [[ "$STORE" != debug ]]; then
            AAB=$(find out -maxdepth 1 -name '*.aab' -print -quit)
            test -n "$AAB"
            jarsigner -verify "$AAB" | tee signature.txt
            grep -Fx 'jar verified.' signature.txt
            if unzip -l "$APK" | grep -E 'assets/public/assets/shop-[^/]+\.js$' > crypto-bundle.txt; then
              cat crypto-bundle.txt
              exit 1
            fi
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: toranj-${{ matrix.target }}
          path: |
            out/*.apk
            out/*.aab
          if-no-files-found: error

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.prepare.outputs.version }}
      TARGETS: ${{ needs.prepare.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: toranj-*
          path: release
          merge-multiple: true
      - name: Publish tagged GitHub Release
        shell: bash
        run: |
          (cd release && sha256sum ./*.apk $(find . -maxdepth 1 -name '*.aab' -print) > SHA256SUMS.txt)
          printf 'کانال‌های ساخته‌شده: %s\n\nفایل دیباگ برای نصب و آزمون بازی است. APKهای بازار و مایکت با خرید اختصاصی فروشگاه ساخته می‌شوند.\n' "$TARGETS" > notes.md
          gh release create "v$VERSION" release/* --target "$GITHUB_SHA" --title "دوئل ترنج v$VERSION" --notes-file notes.md
